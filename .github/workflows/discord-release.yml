name: RecordsWeb Discord Release Notification

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to send (leave blank for latest)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  send-discord-release:
    name: Send release announcement to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement to Discord
        env:
          DISCORD_WEBHOOK_URL_1: ${{ secrets.DISCORD_WEBHOOK_URL_1 }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}

        run: |
          python <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import urllib.parse

          from datetime import datetime
          from zoneinfo import ZoneInfo


          # --------------------------------------------------
          # Configuration
          # --------------------------------------------------

          webhook_urls = [
              os.environ.get("DISCORD_WEBHOOK_URL_1", "").strip(),
              os.environ.get("DISCORD_WEBHOOK_URL_2", "").strip(),
          ]

          webhook_urls = [
              url
              for url in webhook_urls
              if url
          ]

          if not webhook_urls:
              raise RuntimeError(
                  "No Discord webhook URLs were configured."
              )

          github_token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_path = os.environ["GITHUB_EVENT_PATH"]

          manual_tag = (
              os.environ.get("MANUAL_RELEASE_TAG", "")
              .strip()
          )


          # --------------------------------------------------
          # GitHub API helper
          # --------------------------------------------------

          def github_request(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "RecordsWeb-Release-Notifier"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # --------------------------------------------------
          # Determine which release to send
          # --------------------------------------------------

          if event_name == "release":
              with open(
                  event_path,
                  "r",
                  encoding="utf-8"
              ) as event_file:
                  event = json.load(event_file)

              release = event["release"]

          elif manual_tag:
              encoded_tag = urllib.parse.quote(
                  manual_tag,
                  safe=""
              )

              release = github_request(
                  f"https://api.github.com/repos/"
                  f"{repository}/releases/tags/{encoded_tag}"
              )

          else:
              releases = github_request(
                  f"https://api.github.com/repos/"
                  f"{repository}/releases?per_page=30"
              )

              valid_releases = [
                  item
                  for item in releases
                  if not item.get("draft", False)
                  and item.get("published_at")
              ]

              if not valid_releases:
                  raise RuntimeError(
                      "No published RecordsWeb releases were found."
                  )

              valid_releases.sort(
                  key=lambda item: item.get(
                      "published_at",
                      ""
                  ),
                  reverse=True
              )

              release = valid_releases[0]


          # --------------------------------------------------
          # Read release information
          # --------------------------------------------------

          release_tag = (
              release.get("tag_name", "")
              .strip()
          )

          release_body = (
              release.get("body") or ""
          ).strip()

          published_at = (
              release.get("published_at") or ""
          )

          prerelease = bool(
              release.get("prerelease", False)
          )

          version = release_tag.lstrip("vV")


          # --------------------------------------------------
          # Date/time - UK local time
          # --------------------------------------------------

          if published_at:
              published = datetime.fromisoformat(
                  published_at.replace(
                      "Z",
                      "+00:00"
                  )
              )

              published_uk = published.astimezone(
                  ZoneInfo("Europe/London")
              )

              date_string = published_uk.strftime(
                  "%d/%m/%Y"
              )

              time_string = published_uk.strftime(
                  "%H:%M"
              )

          else:
              date_string = "Unknown"
              time_string = "Unknown"


          # --------------------------------------------------
          # Clean release notes
          # --------------------------------------------------

          if not release_body:
              release_body = (
                  "- No release notes were provided."
              )

          release_body = re.sub(
              r"\[([^\]]+)\]\("
              r"https?://(?:www\.)?github\.com/"
              r"[^)]+\)",
              r"\1",
              release_body,
              flags=re.IGNORECASE
          )

          release_body = re.sub(
              r"https?://(?:www\.)?github\.com/"
              r"\S+",
              "",
              release_body,
              flags=re.IGNORECASE
          )

          release_body = re.sub(
              r"\n{3,}",
              "\n\n",
              release_body
          ).strip()

          if len(release_body) > 3000:
              release_body = (
                  release_body[:2997]
                  + "..."
              )


          # --------------------------------------------------
          # Build Discord message
          # --------------------------------------------------

          title = f"RecordsWeb V{version}"

          if prerelease:
              title += " — Pre-release"

          description = (
              f"Updated at "
              f"**{date_string} {time_string}**\n"
              f"━━━━━━━━━━━━━━━━━━━━\n\n"
              f"**What was added**\n\n"
              f"{release_body}"
          )

          payload = {
              "username": "RecordsWeb Updates",
              "embeds": [
                  {
                      "title": title,
                      "description": description,
                      "color": 3447003,
                      "footer": {
                          "text": (
                              "RecordsWeb • "
                              "Grove Way Health Centre"
                          )
                      }
                  }
              ]
          }


          # --------------------------------------------------
          # Send to all Discord webhooks
          # --------------------------------------------------

          successful = 0

          for index, webhook_url in enumerate(
              webhook_urls,
              start=1
          ):
              discord_request = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(
                      payload
                  ).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": (
                          "RecordsWeb-Release-Notifier"
                      )
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      discord_request
                  ) as response:
                      print(
                          f"Discord webhook {index} sent. "
                          f"HTTP {response.status}"
                      )

                      successful += 1

              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Discord webhook {index} failed:"
                  )

                  print(error_body)

                  raise


          print(
              f"RecordsWeb V{version} was sent "
              f"to {successful} Discord webhook(s)."
          )
          PY
