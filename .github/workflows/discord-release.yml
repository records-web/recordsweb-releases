name: RecordsWeb Discord Release Notification

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  send-discord-release:
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]

          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          release_body = os.environ.get("RELEASE_BODY", "").strip()
          published_at = os.environ.get("RELEASE_PUBLISHED_AT", "").strip()
          prerelease = (
              os.environ.get("RELEASE_PRERELEASE", "false").lower()
              == "true"
          )

          version = release_tag.lstrip("vV")

          if published_at:
              published = datetime.fromisoformat(
                  published_at.replace("Z", "+00:00")
              )

              published_uk = published.astimezone(
                  ZoneInfo("Europe/London")
              )

              date_string = published_uk.strftime("%d/%m/%Y")
              time_string = published_uk.strftime("%H:%M")
          else:
              date_string = "Unknown"
              time_string = "Unknown"

          if not release_body:
              release_body = "- No release notes were provided."

          if len(release_body) > 3000:
              release_body = release_body[:2997] + "..."

          title = f"RecordsWeb V{version}"

          if prerelease:
              title += " — Pre-release"

          description = (
              f"Updated at **{date_string} {time_string}**\n"
              f"━━━━━━━━━━━━━━━━━━━━\n"
              f"**What was added**\n\n"
              f"{release_body}"
          )

          payload = {
              "username": "RecordsWeb Updates",
              "embeds": [
                  {
                      "title": title,
                      "description": description,
                      "color": 3447003,
                      "footer": {
                          "text": "RecordsWeb • Grove Way Health Centre"
                      }
                  }
              ]
          }

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "RecordsWeb-Release-Notifier"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(
                  f"Discord notification completed with HTTP "
                  f"{response.status}"
              )
          PY
