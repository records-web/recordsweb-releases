name: RecordsWeb Discord Release Notification

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-discord-release:
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}

        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]
          github_token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_path = os.environ["GITHUB_EVENT_PATH"]

          # -----------------------------------------
          # Get the release
          # -----------------------------------------

          if event_name == "release":
              with open(event_path, "r", encoding="utf-8") as f:
                  event = json.load(f)

              release = event["release"]

          else:
              # Manual Run Workflow:
              # Find the most recently published non-draft release.
              api_url = (
                  f"https://api.github.com/repos/"
                  f"{repository}/releases?per_page=10"
              )

              request = urllib.request.Request(
                  api_url,
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "RecordsWeb-Release-Notifier"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  releases = json.loads(
                      response.read().decode("utf-8")
                  )

              release = next(
                  (
                      item
                      for item in releases
                      if not item.get("draft", False)
                  ),
                  None
              )

              if not release:
                  raise RuntimeError(
                      "No published RecordsWeb release was found."
                  )

          # -----------------------------------------
          # Release information
          # -----------------------------------------

          release_tag = release.get("tag_name", "").strip()
          release_body = (release.get("body") or "").strip()
          published_at = release.get("published_at") or ""
          prerelease = release.get("prerelease", False)

          version = release_tag.lstrip("vV")

          # -----------------------------------------
          # UK date/time
          # -----------------------------------------

          if published_at:
              published = datetime.fromisoformat(
                  published_at.replace("Z", "+00:00")
              )

              published_uk = published.astimezone(
                  ZoneInfo("Europe/London")
              )

              date_string = published_uk.strftime("%d/%m/%Y")
              time_string = published_uk.strftime("%H:%M")

          else:
              date_string = "Unknown"
              time_string = "Unknown"

          # -----------------------------------------
          # Release notes
          # -----------------------------------------

          if not release_body:
              release_body = "- No release notes were provided."

          if len(release_body) > 3000:
              release_body = (
                  release_body[:2997] + "..."
              )

          title = f"RecordsWeb V{version}"

          if prerelease:
              title += " — Pre-release"

          description = (
              f"Updated at **{date_string} {time_string}**\n"
              f"━━━━━━━━━━━━━━━━━━━━\n"
              f"\n"
              f"**What was added**\n"
              f"\n"
              f"{release_body}"
          )

          # -----------------------------------------
          # Discord embed
          # -----------------------------------------

          payload = {
              "username": "RecordsWeb Updates",
              "embeds": [
                  {
                      "title": title,
                      "description": description,
                      "color": 3447003,
                      "footer": {
                          "text": (
                              "RecordsWeb • "
                              "Grove Way Health Centre"
                          )
                      }
                  }
              ]
          }

          # -----------------------------------------
          # Send to Discord
          # -----------------------------------------

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "RecordsWeb-Release-Notifier"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(
                  "Discord notification sent successfully. "
                  f"HTTP {response.status}"
              )

          print(
              f"Sent RecordsWeb V{version} to Discord."
          )
          PY
